apiVersion: v1
kind: ConfigMap
metadata:
  name: rayjob-code-{{job_id}}
  namespace: default
  labels:
    ray.io/job-id: "{{job_id}}"
    app.kubernetes.io/name: "mlsecops-rayjob"
data:
  user_code.py: |
{{user_code_content_indented}}
  ray_wrapper.py: |
{{ray_wrapper_content_indented}}
  entrypoint.sh: |
    #!/bin/bash
    set -e
    {{entrypoint_cmd}}
---
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: rayjob-{{job_id}}
  namespace: default
  labels:
    ray.io/job-id: "{{job_id}}"
    app.kubernetes.io/name: "mlsecops-rayjob"
spec:
  submissionMode: "HTTPMode"
  entrypoint: bash /app/user_code/entrypoint.sh
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 5
  rayClusterSpec:
    rayVersion: '2.57.0'
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        memory: '536870912'
        object-store-memory: '268435456'
      template:
        metadata:
          labels:
            ray.io/job-id: "{{job_id}}"
            app.kubernetes.io/name: "kuberay"
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 100
            fsGroup: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ray-head
              image: mlsecops-ray:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                limits:
                  cpu: "1.5"
                  memory: "2.5Gi"
                requests:
                  cpu: "500m"
                  memory: "768Mi"
              livenessProbe:
                exec:
                  command:
                    - bash
                    - -c
                    - wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success && wget -T 2 -q -O- http://localhost:8265/api/gcs_healthz | grep success
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 120
              readinessProbe:
                exec:
                  command:
                    - bash
                    - -c
                    - wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success && wget -T 2 -q -O- http://localhost:8265/api/gcs_healthz | grep success
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 10
              env:
                - name: MLFLOW_TRACKING_URI
                  value: "{{mlflow_tracking_uri}}"
                - name: MLFLOW_S3_ENDPOINT_URL
                  value: "{{mlflow_s3_endpoint_url}}"
                - name: AWS_ACCESS_KEY_ID
                  value: "{{aws_access_key_id}}"
                - name: AWS_SECRET_ACCESS_KEY
                  value: "{{aws_secret_access_key}}"
                - name: AWS_SESSION_TOKEN
                  value: "{{aws_session_token}}"
                - name: MLFLOW_S3_IGNORE_TLS
                  value: "{{mlflow_s3_ignore_tls}}"
                - name: LAKEFS_ENDPOINT
                  value: "{{lakefs_endpoint}}"
                - name: LAKEFS_ACCESS_KEY_ID
                  value: "{{lakefs_access_key_id}}"
                - name: LAKEFS_SECRET_ACCESS_KEY
                  value: "{{lakefs_secret_access_key}}"
                - name: LAKEFS_DEFAULT_BRANCH
                  value: "{{lakefs_default_branch}}"
                - name: MINIO_ENDPOINT
                  value: "{{minio_endpoint}}"
              volumeMounts:
                - name: code-volume
                  mountPath: /app/user_code
                - name: tmp-volume
                  mountPath: /tmp
          volumes:
            - name: code-volume
              configMap:
                name: rayjob-code-{{job_id}}
            - name: tmp-volume
              emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rayjob-netpol-{{job_id}}
  namespace: default
  labels:
    ray.io/job-id: "{{job_id}}"
    app.kubernetes.io/name: "mlsecops-rayjob"
spec:
  podSelector:
    matchLabels:
      ray.io/job-id: "{{job_id}}"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow communication within Ray cluster and health probes
    - from:
        - podSelector:
            matchLabels:
              ray.io/job-id: "{{job_id}}"
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 8265
        - protocol: TCP
          port: 10001
        - protocol: TCP
          port: 52365
  egress:
    # 1. Allow DNS lookups
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow communication within the Ray cluster
    - to:
        - podSelector:
            matchLabels:
              ray.io/job-id: "{{job_id}}"
    # 3. Allow egress strictly to MLSecOps platform services
    - ports:
        - protocol: TCP
          port: 8000   # LakeFS
        - protocol: TCP
          port: 9000   # MinIO
        - protocol: TCP
          port: 5000   # MLflow
