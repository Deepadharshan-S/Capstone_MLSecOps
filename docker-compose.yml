services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:16-alpine
    container_name: sentinelml-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - sentinelml


  # ==========================================================
  # MinIO
  # ==========================================================

  minio:
    image: minio/minio:latest
    container_name: sentinelml-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_NOTIFY_WEBHOOK_ENABLE_SENTINEL: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_SENTINEL: "${MINIO_NOTIFY_WEBHOOK_ENDPOINT:-http://host.docker.internal:8001/api/webhooks/minio/storage-events}"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_SENTINEL: "${MINIO_WEBHOOK_SECRET:-sentinelml-dev-minio-webhook-secret-32b}"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    healthcheck:
      # The minio image ships `mc` but no curl/wget, so probe through mc.
      test:
        [
          "CMD-SHELL",
          "mc alias set -q local http://127.0.0.1:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD && mc ready local",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - sentinelml


  # ==========================================================
  # lakeFS
  # ==========================================================

  lakefs:
    image: treeverse/lakefs:latest
    container_name: sentinelml-lakefs
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      minio:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:

      # ------------------------------------------------------
      # Database
      # ------------------------------------------------------

      LAKEFS_DATABASE_TYPE: postgres

      LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING: ${LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING}


      # ------------------------------------------------------
      # Blockstore
      # ------------------------------------------------------

      LAKEFS_BLOCKSTORE_TYPE: s3

      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000

      LAKEFS_BLOCKSTORE_S3_DISABLE_PRE_SIGNED: "true"

      LAKEFS_BLOCKSTORE_S3_REGION: us-east-1

      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"

      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}

      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}


      # ------------------------------------------------------
      # Authentication
      # ------------------------------------------------------

      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_AUTH_ENCRYPT_SECRET_KEY}


    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8000/api/healthcheck || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - sentinelml


  # ==========================================================
  # FastAPI Backend
  # ==========================================================

  # backend:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile

  #   container_name: sentinelml-backend
  #   restart: unless-stopped

  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  #     lakefs:
  #       condition: service_healthy

  #   ports:
  #     - "8080:8000"

  #   environment:
  #     - LAKEFS_ENDPOINT=http://lakefs:8000

  #   env_file:
  #     - .env

  #   networks:
  #     - sentinelml

  # ==========================================================
  # MLflow Tracking Server
  # ==========================================================

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: sentinelml-mlflow:v3.15.1
    container_name: sentinelml-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
    entrypoint: >
      /bin/sh -c "
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --default-artifact-root s3://mlflow
      --host 0.0.0.0
      --port 5000
      --workers 1
      --allowed-hosts '*'
      "
    networks:
      - sentinelml

  # ==========================================================
  # MinIO Bucket Creator Helper
  # ==========================================================

  createbuckets:
    image: minio/mc:latest
    container_name: sentinelml-minio-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      LAKEFS_BLOCKSTORE_BUCKET: ${LAKEFS_BLOCKSTORE_BUCKET:-lakefs}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/$${LAKEFS_BLOCKSTORE_BUCKET};
      /usr/bin/mc mb --ignore-existing myminio/mlflow;
      /usr/bin/mc event add myminio/$${LAKEFS_BLOCKSTORE_BUCKET} arn:minio:sqs::SENTINEL:webhook --event put,delete -p;
      exit 0;
      "
    networks:
      - sentinelml

  # ==========================================================
  # OpenTelemetry Collector Contrib
  # ==========================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: sentinelml-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      # OTLP receivers accessible by host FastAPI and Kubernetes workloads
      - "4317:4317"             # OTLP gRPC
      - "4318:4318"             # OTLP HTTP
      # Internal telemetry endpoints
      - "127.0.0.1:8889:8889"   # Prometheus metrics exporter
      - "127.0.0.1:13133:13133" # Health check
    depends_on:
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - sentinelml

  # ==========================================================
  # Grafana Tempo (Distributed Tracing)
  # ==========================================================
  tempo:
    image: grafana/tempo:2.6.1
    container_name: sentinelml-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200" # Tempo HTTP query API
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - sentinelml

  # ==========================================================
  # Prometheus (Metrics Storage & Scraper)
  # ==========================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sentinelml-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - sentinelml

  # ==========================================================
  # Grafana Loki (Log Aggregation)
  # ==========================================================
  loki:
    image: grafana/loki:3.2.1
    container_name: sentinelml-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - sentinelml

  # ==========================================================
  # Grafana (Unified Observability Dashboard)
  # ==========================================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: sentinelml-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - sentinelml


# ============================================================
# Networks
# ============================================================

networks:
  sentinelml:
    name: sentinelml
    driver: bridge


# ============================================================
# Volumes
# ============================================================

volumes:

  postgres_data:
    name: postgres_data

  minio_data:
    name: sentinelml_minio_data

  tempo_data:
    name: sentinelml_tempo_data

  prometheus_data:
    name: sentinelml_prometheus_data

  loki_data:
    name: sentinelml_loki_data

  grafana_data:
    name: sentinelml_grafana_data